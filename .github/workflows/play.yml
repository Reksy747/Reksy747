name: Play Incident Commander

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

# One move at a time so simultaneous clicks cannot corrupt the state file.
concurrency:
  group: game
  cancel-in-progress: false

jobs:
  play:
    # Leave real issues (a recruiter's message, a bug report) alone; only `play:` titles are game moves.
    if: startsWith(github.event.issue.title, 'play:')
    runs-on: ubuntu-latest
    steps:
      # Branch tip at run time, not the SHA from when the issue was opened, so queued moves see the latest state.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      # The issue title reaches Python only through env vars, never interpolated into shell.
      - id: play
        run: python3 scripts/game.py
        env:
          TITLE: ${{ github.event.issue.title }}
          USER: ${{ github.event.issue.user.login }}
          NUMBER: ${{ github.event.issue.number }}

      - if: steps.play.outputs.applied == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state README.md
          git commit -m "game: move from issue #$NUMBER"
          git push
        env:
          NUMBER: ${{ github.event.issue.number }}

      - run: |
          gh issue comment "$NUMBER" --body-file reply.md
          gh issue close "$NUMBER"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}

      - if: failure()
        run: |
          gh issue comment "$NUMBER" --body "The bot itself is on fire 🔥 Something went wrong processing this move, so the board may not have changed. Check the README and try again."
          gh issue close "$NUMBER"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
